<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | JOVA Property Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    .header {
      background: #0b1735;
      padding: 28px 18px;
      text-align: center;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      color: white;
    }

    .logo span {
      color: #d9b66f;
    }

    .marketplace {
      color: white;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .container {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #0b1735;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #253047;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d6d9df;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d9b66f;
      box-shadow: 0 0 0 3px rgba(217, 182, 111, 0.15);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #d9b66f;
      color: #0b1735;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a21d1d;
    }

    .message.success {
      display: block;
      background: #eefbf3;
      color: #166534;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #0b1735;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .header {
        padding: 24px 12px;
      }

      .logo {
        font-size: 34px;
      }

      .marketplace {
        font-size: 17px;
      }

      .brand {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <div class="logo">JO<span>VA</span></div>
      <div class="marketplace">Property Marketplace</div>
    </div>
  </header>

  <main class="container">
    <div class="card">

      <h1>Forgot your password?</h1>

      <p class="subtitle">
        Enter your email address and we'll send you a secure password reset link.
      </p>

      <div id="message" class="message"></div>

      <form id="forgotForm">

        <div class="field">
          <label for="email">Email Address</label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <button
          type="submit"
          class="btn"
          id="submitBtn"
        >
          Send Reset Link
        </button>

      </form>

      <div class="back">
        <a href="/login.html">← Back to Login</a>
      </div>

    </div>
  </main>

  <script>
    const form = document.getElementById("forgotForm");
    const email = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const emailValue = email.value.trim();

      if (!emailValue) {
        showMessage("Please enter your email address.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        const response = await fetch("/api/auth/forgot-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            email: emailValue
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || "Unable to process your request."
          );
        }

        showMessage(
          "If an account exists for this email, a password reset link has been sent.",
          "success"
        );

        email.value = "";

      } catch (error) {

        showMessage(
          error.message || "Something went wrong. Please try again.",
          "error"
        );

      } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";

      }
    });
  </script>

</body>
</html>
