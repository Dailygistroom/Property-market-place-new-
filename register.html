<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your JOVA Account</title>
  <meta name="description" content="Create your JOVA account to list and manage properties.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 14px;
    }

    .brand h1 {
      margin: 0;
      font-size: 36px;
      letter-spacing: 3px;
      color: #d6b36a;
    }

    .brand p {
      margin: 5px 0 0;
      color: #aeb8c6;
      font-size: 14px;
    }

    .card {
      background: #0d1d32;
      border: 1px solid rgba(214, 179, 106, 0.25);
      border-radius: 18px;
      padding: 22px 20px;
      box-shadow: 0 18px 50px rgba(0,0,0,0.3);
    }

    h2 {
      margin: 0 0 5px;
      font-size: 23px;
    }

    .subtitle {
      color: #aeb8c6;
      margin: 0 0 17px;
      line-height: 1.4;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 11px 0 5px;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      border-radius: 9px;
      border: 1px solid #314258;
      background: #08172a;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #d6b36a;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 50px;
    }

    .toggle-password {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .referral-toggle {
      display: block;
      margin-top: 12px;
      color: #d6b36a;
      font-size: 13px;
      cursor: pointer;
    }

    .referral-box {
      display: none;
      margin-top: 7px;
    }

    .referral-box.show {
      display: block;
    }

    .referral-box input {
      text-transform: uppercase;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #d6b36a;
      color: #071426;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 13px;
      padding: 11px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;
      background: rgba(180, 45, 45, 0.15);
      border: 1px solid rgba(220, 80, 80, 0.35);
      color: #ffb4b4;
    }

    .message.success {
      display: block;
      background: rgba(45, 150, 90, 0.15);
      border: 1px solid rgba(80, 190, 120, 0.35);
      color: #a9f0c5;
    }

    .login {
      text-align: center;
      margin-top: 15px;
      color: #aeb8c6;
      font-size: 13px;
    }

    .login a {
      color: #d6b36a;
      text-decoration: none;
      font-weight: 600;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 13px;
      color: #aeb8c6;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      <h1>JOVA</h1>
      <p>Find. List. Move.</p>
    </div>

    <section class="card">

      <h2>Create your account</h2>

      <p class="subtitle">
        Join JOVA to list and manage your properties.
      </p>

      <form id="registerForm" novalidate>

        <label for="name">Full Name</label>
        <input
          id="name"
          type="text"
          autocomplete="name"
          placeholder="Enter your full name"
        >

        <label for="email">Email Address</label>
        <input
          id="email"
          type="text"
          inputmode="email"
          autocomplete="email"
          placeholder="you@example.com"
        >

        <label for="phone">Phone Number</label>
        <input
          id="phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          placeholder=""
        >

        <label for="role">Account Type</label>
        <select id="role">
          <option value="">Select account type</option>
          <option value="agent">Agent</option>
          <option value="landlord">Landlord</option>
          <option value="developer">Developer</option>
        </select>

        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            autocomplete="new-password"
            placeholder="At least 8 characters"
          >

          <button
            type="button"
            class="toggle-password"
            data-target="password"
            aria-label="Show password"
          >👁️</button>
        </div>

        <label for="confirmPassword">Confirm Password</label>

        <div class="password-wrap">
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            placeholder="Repeat your password"
          >

          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword"
            aria-label="Show password"
          >👁️</button>
        </div>

        <div
          class="referral-toggle"
          id="referralToggle"
          role="button"
          tabindex="0"
        >
          + Have a referral code?
        </div>

        <div class="referral-box" id="referralBox">
          <input
            id="referral"
            type="text"
            maxlength="8"
            placeholder="Enter referral code"
          >
        </div>

        <button type="submit" id="submitBtn">
          Create JOVA Account
        </button>

      </form>

      <div id="message" class="message"></div>

      <div class="login">
        Already have an account?
        <a href="/login.html">Log in</a>
      </div>

      <a href="/" class="back">← Back to JOVA</a>

    </section>

  </main>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    /* Password visibility */
    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", function () {
        const input = document.getElementById(this.dataset.target);

        if (input.type === "password") {
          input.type = "text";
          this.textContent = "🙈";
          this.setAttribute("aria-label", "Hide password");
        } else {
          input.type = "password";
          this.textContent = "👁️";
          this.setAttribute("aria-label", "Show password");
        }
      });
    });

    /* Referral */
    const referralToggle =
      document.getElementById("referralToggle");

    const referralBox =
      document.getElementById("referralBox");

    referralToggle.addEventListener("click", () => {
      referralBox.classList.toggle("show");

      referralToggle.textContent =
        referralBox.classList.contains("show")
          ? "− Hide referral code"
          : "+ Have a referral code?";
    });

    function showError(text) {
      message.className = "message error";
      message.textContent = text;
    }

    function normalizePhone(value) {
      let phone = String(value || "")
        .trim()
        .replace(/[\s\-()]/g, "");

      if (phone.startsWith("+234")) {
        phone = "0" + phone.substring(4);
      }

      if (phone.startsWith("234")) {
        phone = "0" + phone.substring(3);
      }

      return phone;
    }

    form.addEventListener("submit", async function (event) {

      event.preventDefault();

      message.className = "message";
      message.textContent = "";

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        normalizePhone(
          document.getElementById("phone").value
        );

      const role =
        document.getElementById("role").value;

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      const referral =
        document.getElementById("referral").value
          .trim()
          .toUpperCase();

      /* Our own validation */

      if (!name) {
        showError("Please enter your full name.");
        return;
      }

      if (!email || !email.includes("@")) {
        showError("Please enter a valid email address.");
        return;
      }

      if (!/^0\d{10}$/.test(phone)) {
        showError(
          "Please enter a valid Nigerian phone number."
        );
        return;
      }

      if (!role) {
        showError("Please select your account type.");
        return;
      }

      if (password.length < 8) {
        showError(
          "Your password must be at least 8 characters."
        );
        return;
      }

      if (password !== confirmPassword) {
        showError("Your passwords do not match.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";

      try {

        /*
          IMPORTANT:
          The registration page and API are on the
          same Cloudflare Worker, so use a relative API path.
        */

        const response = await fetch(
          "/api/auth/register",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({
              name: name,
              email: email,
              phone: phone,
              role: role,
              password: password,
              referral_code: referral || null
            })
          }
        );

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            data.message ||
            "Unable to create your JOVA account."
          );
        }

        message.className = "message success";

        message.textContent =
          "Your JOVA account has been created successfully.";

        submitBtn.textContent = "Account Created";

        setTimeout(() => {
          window.location.href = "/";
        }, 1200);

      } catch (error) {

        console.error("JOVA registration error:", error);

        message.className = "message error";

        message.textContent =
          error && error.message
            ? error.message
            : "Something went wrong. Please try again.";

        submitBtn.disabled = false;
        submitBtn.textContent = "Create JOVA Account";
      }
    });
  </script>

</body>
</html>
