<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | JOVA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    .header {
      background: #0b1735;
      padding: 22px 24px;
      text-align: center;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      color: white;
    }

    .logo span {
      color: #d9b66f;
    }

    .container {
      min-height: calc(100vh - 82px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #0b1735;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #253047;
    }

    .field {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d6d9df;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d9b66f;
      box-shadow: 0 0 0 3px rgba(217,182,111,0.15);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 18px;
    }

    .login-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #d9b66f;
      color: #0b1735;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:disabled {
      opacity: 0.65;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a21d1d;
    }

    .message.success {
      display: block;
      background: #eefbf3;
      color: #166534;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #6b7280;
    }

    .register a {
      color: #0b1735;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">JO<span>VA</span></div>
  </header>

  <main class="container">
    <div class="card">

      <h1>Welcome back</h1>
      <p class="subtitle">
        Sign in to manage your JOVA property listings and account.
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="field">
          <label for="email">Email Address</label>
          <input
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="password-wrap">
            <input
              id="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle"
              id="togglePassword"
              aria-label="Show password"
            >👁️</button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          Login to JOVA
        </button>

      </form>

      <div class="register">
        Don't have a JOVA account?
        <a href="/register.html">Create an account</a>
      </div>

    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const showing = password.type === "text";

      password.type = showing ? "password" : "text";
      togglePassword.textContent = showing ? "👁️" : "🙈";
    });

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const emailValue = email.value.trim();
      const passwordValue = password.value;

      if (!emailValue || !passwordValue) {
        showMessage("Please enter your email and password.", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      message.className = "message";
      message.textContent = "";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: emailValue,
            password: passwordValue
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          throw new Error(data.error || "Login failed.");
        }

        if (data.token) {
          localStorage.setItem("jova_token", data.token);
        }

        if (data.user) {
          localStorage.setItem("jova_user", JSON.stringify(data.user));
        }

        showMessage("Login successful. Welcome to JOVA!", "success");

        setTimeout(() => {
          window.location.href = "/";
        }, 700);

      } catch (error) {
        showMessage(error.message || "Unable to login. Please try again.", "error");

        loginBtn.disabled = false;
        loginBtn.textContent = "Login to JOVA";
      }
    });
  </script>

</body>
</html>
