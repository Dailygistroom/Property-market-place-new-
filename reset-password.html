<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | JOVA Property Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #111827;
    }

    .header {
      background: #0b1735;
      padding: 28px 18px;
      text-align: center;
    }

    .brand {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -1px;
      color: white;
    }

    .logo span {
      color: #d9b66f;
    }

    .marketplace {
      color: white;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .container {
      min-height: calc(100vh - 100px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 18px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      color: #0b1735;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #6b7280;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #253047;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d6d9df;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #d9b66f;
      box-shadow: 0 0 0 3px rgba(217,182,111,0.15);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 16px;
      background: #d9b66f;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .65;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a21d1d;
    }

    .message.success {
      display: block;
      background: #eefbf3;
      color: #166534;
    }

    .back {
      text-align: center;
      margin-top: 22px;
    }

    .back a {
      color: #0b1735;
      font-weight: 700;
      text-decoration: none;
    }

    @media(max-width:480px) {
      .header {
        padding: 24px 12px;
      }

      .logo {
        font-size: 34px;
      }

      .marketplace {
        font-size: 17px;
      }

      .brand {
        gap: 8px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="logo">JO<span>VA</span></div>
    <div class="marketplace">Property Marketplace</div>
  </div>
</header>

<main class="container">
  <div class="card">

    <h1>Reset your password</h1>

    <p class="subtitle">
      Choose a new password for your JOVA account.
    </p>

    <div id="message" class="message"></div>

    <form id="resetForm">

      <div class="field">
        <label for="password">New Password</label>
        <input
          id="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Enter new password"
          required
        >
      </div>

      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input
          id="confirm"
          type="password"
          minlength="8"
          autocomplete="new-password"
          placeholder="Confirm new password"
          required
        >
      </div>

      <button type="submit" class="btn" id="submitBtn">
        Reset Password
      </button>

    </form>

    <div class="back">
      <a href="/login.html">← Back to Login</a>
    </div>

  </div>
</main>

<script>
const form = document.getElementById("resetForm");
const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

const token = new URLSearchParams(window.location.search).get("token");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

if (!token) {
  showMessage(
    "This password reset link is missing or invalid.",
    "error"
  );
  form.style.display = "none";
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const newPassword = password.value;
  const confirm = confirmPassword.value;

  if (newPassword.length < 8) {
    showMessage(
      "Password must be at least 8 characters.",
      "error"
    );
    return;
  }

  if (newPassword !== confirm) {
    showMessage(
      "The passwords do not match.",
      "error"
    );
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = "Resetting...";

  try {
    const response = await fetch(
      "/api/auth/reset-password",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          token: token,
          password: newPassword
        })
      }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(
        data.message || "Unable to reset your password."
      );
    }

    showMessage(
      "Password reset successfully. Redirecting to login...",
      "success"
    );

    form.style.display = "none";

    setTimeout(function() {
      window.location.href = "/login.html";
    }, 1500);

  } catch (error) {
    showMessage(
      error.message || "Something went wrong. Please try again.",
      "error"
    );

    submitBtn.disabled = false;
    submitBtn.textContent = "Reset Password";
  }
});
</script>

</body>
</html>
